name: Daily Market Scan

on:
  schedule:
    - cron: '15 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run daily scan
        run: python daily_scan.py

      - name: Commit updated results
        run: |
          git config user.name "daily-scan-bot"
          git config user.email "actions@github.com"
          git add scan_results.json
          git diff --staged --quiet || git commit -m "Daily scan: $(date -u +%Y-%m-%d)"
          git push
